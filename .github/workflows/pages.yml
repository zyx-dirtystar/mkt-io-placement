name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate and validate website data
        run: |
          node scripts/sync-data.mjs
          node scripts/faculty-report.mjs
          node scripts/check.mjs
          node scripts/check-placement.mjs
          node scripts/check-evidence.mjs
          node scripts/check-faculty.mjs
          node scripts/check-observatory.mjs
          node --test scripts/tests/*.test.mjs tests/*.test.mjs
          node scripts/release-report.mjs
          node --check dist/faculty-view.js
          node --check dist/evidence-view.js
          node --check dist/app.js
          node --check dist/core.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
